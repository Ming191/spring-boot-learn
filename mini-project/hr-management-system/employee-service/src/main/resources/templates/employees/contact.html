<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Contact</title>
    <link rel="stylesheet" th:href="@{/css/hr-views.css}">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div>
            <h1>Update Contact</h1>
            <div class="muted" th:text="${employeeName ?: 'Employee profile'}">Employee profile</div>
        </div>
    </header>

    <form class="form-panel" method="post" th:action="@{/employees/{id}/contact(id=${id})}" th:object="${contact}">
        <div class="form-grid">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" th:field="*{phone}">
                <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
        </div>
        <div class="actions">
            <button class="button" type="submit">Save</button>
        </div>
    </form>
</main>
</body>
</html>
