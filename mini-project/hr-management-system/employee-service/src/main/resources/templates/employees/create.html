<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee</title>
    <link rel="stylesheet" th:href="@{/css/hr-views.css}">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <h1>Create Employee</h1>
        <a class="button secondary" th:href="@{/employees}">Back</a>
    </header>

    <form class="form-panel" method="post" th:action="@{/employees}" th:object="${employee}">
        <div class="form-grid">
            <div class="field">
                <label for="employeeCode">Employee code</label>
                <input id="employeeCode" th:field="*{employeeCode}">
                <div class="error" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></div>
            </div>
            <div class="field">
                <label for="fullName">Full name</label>
                <input id="fullName" th:field="*{fullName}">
                <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" th:field="*{phone}">
                <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="field">
                <label for="position">Position</label>
                <input id="position" th:field="*{position}">
                <div class="error" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
            </div>
            <div class="field">
                <label for="departmentId">Department</label>
                <select id="departmentId" th:field="*{departmentId}">
                    <option value="">Select department</option>
                    <option th:each="department : ${departments}"
                            th:value="${department.id}"
                            th:text="${department.name}">Engineering</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
            </div>
            <div class="field">
                <label for="authUserId">Auth user ID</label>
                <input id="authUserId" type="number" min="1" th:field="*{authUserId}">
                <div class="error" th:if="${#fields.hasErrors('authUserId')}" th:errors="*{authUserId}"></div>
            </div>
            <div class="field">
                <label for="salary">Salary</label>
                <input id="salary" type="number" min="0" step="0.01" th:field="*{salary}">
                <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
            <div class="field">
                <label for="startDate">Start date</label>
                <input id="startDate" type="date" th:field="*{startDate}">
                <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>
        </div>
        <div class="actions">
            <button class="button" type="submit">Create</button>
            <a class="button secondary" th:href="@{/employees}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
