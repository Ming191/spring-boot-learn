<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Department</title>
    <link rel="stylesheet" th:href="@{/css/hr-views.css}">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <h1>Edit Department</h1>
        <a class="button secondary" th:href="@{/departments}">Back</a>
    </header>

    <form class="form-panel" method="post" th:action="@{/departments/{id}/edit(id=${id})}" th:object="${department}">
        <div class="field">
            <label for="name">Name</label>
            <input id="name" th:field="*{name}">
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="form-grid">
            <div class="field">
                <label for="managerId">Manager ID</label>
                <input id="managerId" type="number" min="1" th:field="*{managerId}">
                <div class="error" th:if="${#fields.hasErrors('managerId')}" th:errors="*{managerId}"></div>
            </div>
            <div class="field">
                <label for="isActive">Status</label>
                <select id="isActive" th:field="*{isActive}">
                    <option th:value="true">Active</option>
                    <option th:value="false">Inactive</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('isActive')}" th:errors="*{isActive}"></div>
            </div>
        </div>
        <div class="actions">
            <button class="button" type="submit">Save</button>
            <a class="button secondary" th:href="@{/departments}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
