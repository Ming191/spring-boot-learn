server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 5s
            connect-timeout: 2000
          routes:
            - id: auth-public-views
              order: 20
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/login,/register
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: auth-service-circuit-breaker
                    fallbackUri: forward:/fallback/auth-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: auth-service-logout
              order: 21
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/logout
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: auth-service-circuit-breaker
                    fallbackUri: forward:/fallback/auth-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: auth-service-assets
              order: 22
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-assets/**
            - id: employee-service-views
              order: 90
              uri: lb://EMPLOYEE-SERVICE
              predicates:
                - Path=/employees,/employees/**,/departments,/departments/**,/css/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: employee-service-circuit-breaker
                    fallbackUri: forward:/fallback/employee-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: leave-service-views
              order: 90
              uri: lb://LEAVE-SERVICE
              predicates:
                - Path=/leaves,/leaves/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                - name: CircuitBreaker
                  args:
                    name: leave-service-circuit-breaker
                    fallbackUri: forward:/fallback/leave-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters}
    issuer: ${JWT_ISSUER:hr-auth-service}
    audience: ${JWT_AUDIENCE:hr-management-system}

gateway:
  pre-auth-rate-limit:
    enabled: true
    replenish-rate: 30
    burst-capacity: 60
    requested-tokens: 1
  public-paths:
    - /login
    - /register
    - /logout
    - /auth-assets/**
    - /assets/**
    - /css/**
    - /js/**
    - /images/**
    - /error/**
    - /actuator/health
    - /actuator/info
  authorization-rules:
    - path: /employees/*/contact
      methods: [GET, POST]
      roles: [EMPLOYEE, HR]
    - path: /employees
      methods: [GET]
      roles: [HR]
    - path: /employees
      methods: [POST]
      roles: [HR]
    - path: /employees/create
      roles: [HR]
    - path: /employees/*/edit
      roles: [HR]
    - path: /employees/**
      methods: [GET, POST]
      roles: [HR]
    - path: /departments
      methods: [GET]
      roles: [HR]
    - path: /departments
      methods: [POST]
      roles: [HR]
    - path: /departments/create
      roles: [HR]
    - path: /departments/*/edit
      roles: [HR]
    - path: /departments/**
      methods: [GET, POST]
      roles: [HR]
    - path: /leaves/*/approve
      methods: [POST]
      roles: [HR]
    - path: /leaves/*/reject
      methods: [POST]
      roles: [HR]
    - path: /leaves/*/cancel
      methods: [POST]
      roles: [EMPLOYEE]
    - path: /leaves/*/review
      methods: [GET]
      roles: [HR]
    - path: /leaves/my
      methods: [GET]
      roles: [HR, EMPLOYEE]
    - path: /leaves/new
      methods: [GET, POST]
      roles: [HR, EMPLOYEE]
    - path: /leaves
      methods: [GET]
      roles: [HR]
    - path: /leaves/**
      methods: [GET]
      roles: [HR, EMPLOYEE]

resilience4j:
  circuitbreaker:
    instances:
      auth-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slidingWindowType: COUNT_BASED
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
      employee-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slidingWindowType: COUNT_BASED
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
      leave-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slidingWindowType: COUNT_BASED
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
  timelimiter:
    instances:
      auth-service-circuit-breaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      employee-service-circuit-breaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      leave-service-circuit-breaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
