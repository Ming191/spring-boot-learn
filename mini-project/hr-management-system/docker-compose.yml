services:
  mysql:
    image: mysql:8.4
    container_name: hr_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_auth

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.3
    container_name: hr_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: hr_zookeeper

    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: hr_kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-service
    container_name: hr_discovery_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: hr_auth_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql:3306/db_auth
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: local-dev-secret-key-must-be-at-least-32-characters
      APP_JWT_COOKIE_SECURE: false
    ports:
      - "8081:8081"

  employee-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: employee-service
    container_name: hr_employee_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    environment:
      EMP_DB_URL: jdbc:mysql://mysql:3306/db_emp
      EMP_DB_USERNAME: root
      EMP_DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8083:8083"

  leave-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: leave-service
    container_name: hr_leave_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
      employee-service:
        condition: service_started
    environment:
      LEAVE_DB_URL: jdbc:mysql://mysql:3306/db_leave
      LEAVE_DB_USERNAME: root
      LEAVE_DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    container_name: hr_notification_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    environment:
      NOTIFICATION_DB_URL: jdbc:mysql://mysql:3306/db_notification
      NOTIFICATION_DB_USERNAME: root
      NOTIFICATION_DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    container_name: hr_gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
      auth-service:
        condition: service_started
      employee-service:
        condition: service_started
      leave-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: local-dev-secret-key-must-be-at-least-32-characters
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  redis_data:
  
