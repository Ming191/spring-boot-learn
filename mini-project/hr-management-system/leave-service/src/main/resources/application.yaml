server:
  port: 8084
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: leave-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${LEAVE_DB_URL:jdbc:mysql://localhost:3306/db_leave}
    username: ${LEAVE_DB_USERNAME:root}
    password: ${LEAVE_DB_PASSWORD:root}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        linger.ms: 5

app:
  outbox:
    poll-delay-ms: 5000
    retry-delay-seconds: 30
    processing-timeout-seconds: 300
    publish-timeout-ms: 10000
    max-retries: 5

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: vn.amela.leaveservice.entity
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
