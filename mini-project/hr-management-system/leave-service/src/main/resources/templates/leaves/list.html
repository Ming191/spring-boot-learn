<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leaves</title><link rel="stylesheet" th:href="@{/css/hr-views.css}"></head>
<body><main class="shell">
    <header class="topbar"><div><h1 th:text="${myView} ? 'My leaves' : 'Leave requests'">Leave requests</h1><div class="muted" th:text="${leaves.totalElements} + ' requests found'">0 requests found</div></div><nav class="nav"><a class="button secondary" th:if="${isHr}" th:href="@{/leaves}">All leaves</a><a class="button secondary" th:href="@{/leaves/my}">My leaves</a><a class="button" th:href="@{/leaves/new}">New leave</a></nav></header>
    <div class="flash" th:if="${success}" th:text="${success}"></div>
    <form class="toolbar" th:if="${!myView}" method="get" th:action="@{/leaves}">
        <div class="field"><label>Status</label><select name="status"><option value="">All statuses</option><option th:each="status : ${leaveStatuses}" th:value="${status}" th:selected="${filter.status == status}" th:text="${status}"></option></select></div>
        <div class="field"><label>Type</label><select name="leaveType"><option value="">All types</option><option th:each="type : ${leaveTypes}" th:value="${type}" th:selected="${filter.leaveType == type}" th:text="${type}"></option></select></div>
        <div class="field"><label>Department</label><input name="departmentName" th:value="${filter.departmentName}" placeholder="Department"></div>
        <div class="field"><label>From</label><input type="date" name="fromDate" th:value="${filter.fromDate}"></div>
        <div class="field"><label>To</label><input type="date" name="toDate" th:value="${filter.toDate}"></div>
        <input type="hidden" name="page" value="0"><input type="hidden" name="size" th:value="${leaves.size}"><div class="actions"><button class="button" type="submit">Apply</button><a class="button secondary" th:href="@{/leaves}">Reset</a></div>
    </form>
    <section class="panel"><div class="empty muted" th:if="${#lists.isEmpty(leaves.items)}">No leave requests found.</div><div class="table-wrap" th:unless="${#lists.isEmpty(leaves.items)}"><table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="leave : ${leaves.items}"><td><strong th:text="${leave.employeeName}">Employee</strong><div class="muted" th:text="${leave.employeeCode} + ' · ' + ${leave.departmentName}">Code · Department</div></td><td th:text="${leave.leaveType}">ANNUAL</td><td><span th:text="${leave.fromDate}"></span> → <span th:text="${leave.toDate}"></span></td><td th:text="${leave.totalDays}">1</td><td><span class="badge" th:classappend="${leave.status}" th:text="${leave.status}">PENDING</span></td><td><a class="button secondary" th:href="@{/leaves/{id}(id=${leave.id})}">View</a></td></tr></tbody></table></div></section>
</main></body></html>
