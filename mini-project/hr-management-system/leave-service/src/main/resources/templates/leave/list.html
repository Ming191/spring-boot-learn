<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave requests</title>
    <link rel="stylesheet" th:href="@{/leave/css/hr-views.css}" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Leave requests</h1>
          <div
            class="muted"
            th:text="${leaves.totalElements} + ' requests found'"
          >
            0 requests found
          </div>
        </div>
        <div class="actions">
          <div th:replace="~{fragments/nav :: mainNav}"></div>
          <a class="button" th:href="@{/leaves/new}">New leave</a>
        </div>
      </header>

      <div class="flash" th:if="${success}" th:text="${success}"></div>

      <form class="toolbar" method="get" th:action="@{/leaves}">
        <div class="field">
          <label>Status</label>
          <select name="status">
            <option value="">All statuses</option>
            <option
              th:each="status : ${leaveStatuses}"
              th:value="${status}"
              th:selected="${filter.status == status}"
              th:text="${status}"
            ></option>
          </select>
        </div>

        <div class="field">
          <label>Type</label>
          <select name="leaveType">
            <option value="">All types</option>
            <option
              th:each="type : ${leaveTypes}"
              th:value="${type}"
              th:selected="${filter.leaveType == type}"
              th:text="${type}"
            ></option>
          </select>
        </div>

        <div class="field">
          <label>Employee ID</label>
          <input
            name="employeeId"
            th:value="${filter.employeeId}"
            placeholder="Employee ID"
          />
        </div>

        <div class="field">
          <label>Department</label>
          <input
            name="departmentName"
            th:value="${filter.departmentName}"
            placeholder="Department"
          />
        </div>

        <div class="field">
          <label>From</label>
          <input type="date" name="fromDate" th:value="${filter.fromDate}" />
        </div>

        <div class="field">
          <label>To</label>
          <input type="date" name="toDate" th:value="${filter.toDate}" />
        </div>

        <input type="hidden" name="page" value="0" />
        <input type="hidden" name="size" th:value="${leaves.size}" />

        <div class="actions">
          <button class="button" type="submit">Apply</button>
          <a class="button secondary" th:href="@{/leaves}">Reset</a>
        </div>
      </form>

      <section
        th:replace="~{leave/list-fragment :: leaveTable(${leaves}, ${isHr})}"
      ></section>
    </main>
  </body>
</html>
