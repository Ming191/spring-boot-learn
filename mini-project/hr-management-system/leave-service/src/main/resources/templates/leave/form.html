<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New leave</title>
    <link rel="stylesheet" th:href="@{/leave/css/hr-views.css}">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <h1>New leave request</h1>
        <a class="button secondary" th:href="@{/leaves/my}">Back</a>
    </header>

    <form class="form-panel" method="post" th:action="@{/leaves/new}" th:object="${leaveForm}">
        <div class="form-grid">
            <div class="field">
                <label>Leave type</label>
                <select th:field="*{leaveType}">
                    <option value="">Select type</option>
                    <option th:each="type : ${leaveTypes}" th:value="${type}" th:text="${type}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('leaveType')}" th:errors="*{leaveType}"></div>
            </div>

            <div class="field">
                <label>From date</label>
                <input type="date" th:field="*{fromDate}">
                <div class="error" th:if="${#fields.hasErrors('fromDate')}" th:errors="*{fromDate}"></div>
            </div>

            <div class="field">
                <label>To date</label>
                <input type="date" th:field="*{toDate}">
                <div class="error" th:if="${#fields.hasErrors('toDate')}" th:errors="*{toDate}"></div>
            </div>

            <div class="field">
                <label>Reason</label>
                <textarea th:field="*{reason}" placeholder="Reason for leave"></textarea>
                <div class="error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
            </div>
        </div>

        <div class="actions form-actions">
            <button class="button" type="submit">Submit request</button>
            <a class="button secondary" th:href="@{/leaves/my}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
