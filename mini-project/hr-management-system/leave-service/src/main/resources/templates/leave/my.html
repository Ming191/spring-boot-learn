<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My leaves</title>
    <link rel="stylesheet" th:href="@{/leave/css/hr-views.css}" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>My leaves</h1>
          <div
            class="muted"
            th:text="${leaves.totalElements} + ' requests found'"
          >
            0 requests found
          </div>
        </div>
        <div class="actions">
          <div th:replace="~{fragments/nav :: mainNav}"></div>
          <a class="button" th:href="@{/leaves/new}">New leave</a>
        </div>
      </header>

      <div class="flash" th:if="${success}" th:text="${success}"></div>

      <section
        th:replace="~{leave/list-fragment :: leaveTable(${leaves}, ${isHr})}"
      ></section>
    </main>
  </body>
</html>
